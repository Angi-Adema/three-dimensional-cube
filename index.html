<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="3D Rotating Color Cube" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Color Cube</title>
</head>

<body>
    <!-- Declare the canvas the cube will be drawn on -->
    <canvas id="glCanvas" width="500" height="500"></canvas>

    <!-- Create the vertex shader (handles vertex positions and transformations) -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        // Receive the position and color data for each vertex from the WebGL buffer
        // "attribute" identifies data that can be different for each vertex 
        attribute vec4 aPosition;
        attribute vec4 aColor;

        // Store the model-view matrix for transforming vertex positions (rotating the cube)
        // "uniform" means the same matrix is used for every vertex
        uniform mat4 uModelViewMatrix;

        // Pass the vertex color from the vertex shader to the fragment shader
        // "varying" allows the color to be interpolated between vertices
        varying vec4 vColor;

        // Main function that runs for each vertex
        void main()
        {
            // Multiply the vertex position by the model-view matrix and store the transformed position
            gl_Position = uModelViewMatrix * aPosition;

            // Assign the current vertex color to vColor so it can be passed to the fragment shader
            vColor = aColor;
        }
    </script>

    <!-- Create the fragment shader (determines the color of each fragment) -->
    <script id="fragment-shader" type="x-shader/x-fragment">
        // Set medium floating-point precision for calculations in the fragment shader
        precision mediump float;

        // Receive the interpolated color passed from the vertex shader
        varying vec4 vColor;

        // Main function that runs for each fragment
        void main()
        {
            // Set the final fragment color to the interpolated vertex color
            gl_FragColor = vColor;
        }
    </script>

    <!-- Connect the JavaScript file for displaying the cube -->
    <script src="webgl-cube.js"></script>
</body>

</html>
