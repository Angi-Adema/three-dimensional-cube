<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Color Cube</title>
</head>

<body>
    <!-- Create the viewing sliders (taken from Angel and Schreiner Ch. 5 code) -->
<h2>Interactive Orthographic Viewer</h2>

<!-- Control the distance between the near and far clipping planes -->
<div>
    <label for="depthSlider">Depth: 0.05</label>
    <input
        id="depthSlider"
        type="range"
        min="0.05"
        max="3"
        step="0.1"
        value="2">
    <span>3</span>
</div>

<!-- Control the camera's distance from the cube -->
<div>
    <label for="radiusSlider">Radius: 0.05</label>
    <input
        id="radiusSlider"
        type="range"
        min="0.05"
        max="2"
        step="0.1"
        value="1">
    <span>2</span>
</div>

<!-- Control the camera's theta angle -->
<div>
    <label for="thetaSlider">Theta: -90</label>
    <input
        id="thetaSlider"
        type="range"
        min="-90"
        max="90"
        step="5"
        value="0">
    <span>90</span>
</div>

<!-- Control the camera's phi angle -->
<div>
    <label for="phiSlider">Phi: -90</label>
    <input
        id="phiSlider"
        type="range"
        min="-90"
        max="90"
        step="5"
        value="0">
    <span>90</span>
</div>

<!-- Control the width of the orthographic viewing volume -->
<div>
    <label for="widthSlider">Width: 0</label>
    <input
        id="widthSlider"
        type="range"
        min="0"
        max="20"
        step="1"
        value="10">
    <span>20</span>
</div>

<!-- Control the height of the orthographic viewing volume -->
<div>
    <label for="heightSlider">Height: 0</label>
    <input
        id="heightSlider"
        type="range"
        min="0"
        max="20"
        step="1"
        value="10">
    <span>20</span>
</div>

    <!-- Declare the canvas the cube will be drawn on -->
    <canvas id="glCanvas" width="500" height="500"></canvas>

    <!-- Create the vertex shader (handles vertex positions and transformations) -->
    <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
        // Set the version of GLSL (OpenGL Shading Language) to 300 es for WebGL 2.0

        // Receive the position and color data for each vertex from the WebGL buffers
        // "in" identifies data that can be different for each vertex
        in vec4 aPosition;
        in vec4 aColor;

        // Store the matrices used for transforming vertex positions (rotating the cube)
        // "uniform" means the same matrix is used for every vertex
        uniform mat4 uModelViewMatrix;
        uniform mat4 uProjectionMatrix;

        // Pass the vertex color from the vertex shader to the fragment shader
        // "out" identifies data that will be passed to the next stage of the pipeline (the fragment shader)
        out vec4 vColor;

        // Main function that runs for each vertex
        void main()
        {
            // Apply the model-view transformation followed by the projection transformation to the vertex position
            gl_Position = uProjectionMatrix * uModelViewMatrix * aPosition;

            // Assign the current vertex color to vColor so it can be passed to the fragment shader
            vColor = aColor;
        }
    </script>

    <!-- Create the fragment shader (determines the color of each fragment) -->
    <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
        // Set the version of GLSL (OpenGL Shading Language) to 300 es for WebGL 2.0

        // Set medium floating-point precision for calculations in the fragment shader
        precision mediump float;

        // Receive the interpolated color passed from the vertex shader
        in vec4 vColor;

        // Store the final color output for each fragment
        out vec4 fColor;

        // Main function that runs for each fragment
        void main()
        {
            // Set the final fragment color to the interpolated vertex color
            fColor = vColor;
        }
    </script>

    <!-- Connect matrix-vector.js for displaying the cube -->
    <script src="matrix-vector.js"></script>

    <!-- Connect the JavaScript file for displaying the cube -->
    <script src="webgl-cube.js"></script>

</body>

</html>
